<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Error Logs — Vantage HMI Analyzer</title>
<style>
  :root {
    --bg: #0f1216;
    --surface: #171b21;
    --surface-2: #1e242c;
    --line: #2a3139;
    --text: #e8ecf0;
    --muted: #8b949e;
    --amber: #f0a500;
    --amber-dim: rgba(240,165,0,0.15);
    --teal: #3fb8a6;
    --teal-dim: rgba(63,184,166,0.15);
    --red: #e2504a;
    --red-dim: rgba(226,80,74,0.15);
    --blue: #5b9fd4;
    --mono: 'Cascadia Code', 'Courier New', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 6px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; line-height: 1.5; }
  
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; background: var(--surface);
  }
  .brand h1 {
    font-family: var(--mono); font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--text);
  }
  .brand h1 span { color: var(--amber); font-weight: bold; }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 8px 14px; border-radius: var(--radius); cursor: pointer;
    transition: background 0.15s, border-color 0.15s; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--muted); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { border-color: var(--amber); color: var(--amber); }
  .btn-primary:hover { background: var(--amber-dim); }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red-dim); }

  .main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-bottom: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .controls .group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 12px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.5px; }
  .controls select, .controls input { background: var(--bg); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: var(--radius); font-family: var(--mono); font-size: 13px; }
  .controls input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--amber); }

  .log-stats { display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .stat .val { font-family: var(--mono); color: var(--text); font-weight: 600; }
  .stat.error .val { color: var(--red); }
  .stat.warn .val { color: var(--amber); }
  .stat.info .val { color: var(--blue); }

  .log-container {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; min-height: 500px;
  }
  .log-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--surface-2); font-size: 12px; color: var(--muted);
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .log-list { max-height: 60vh; overflow-y: auto; }
  .log-entry {
    border-bottom: 1px solid var(--line); padding: 12px 16px;
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    background: var(--surface);
    transition: background 0.15s;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry:hover { background: var(--surface-2); }
  .log-entry.error { border-left: 3px solid var(--red); }
  .log-entry.warn { border-left: 3px solid var(--amber); }
  .log-entry.info { border-left: 3px solid var(--blue); }
  .log-entry.debug { border-left: 3px solid var(--muted); opacity: 0.7; }

  .log-entry-header {
    display: flex; gap: 12px; align-items: center; margin-bottom: 6px;
    flex-wrap: wrap; font-size: 11px;
  }
  .log-time { color: var(--muted); }
  .log-level { text-transform: uppercase; padding: 2px 8px; border-radius: 3px; font-weight: 600; }
  .log-level.error { background: var(--red-dim); color: var(--red); }
  .log-level.warn { background: var(--amber-dim); color: var(--amber); }
  .log-level.info { background: var(--teal-dim); color: var(--teal); }
  .log-level.debug { background: var(--line); color: var(--muted); }
  .log-source { color: var(--blue); }
  .log-message { color: var(--text); word-break: break-word; margin-bottom: 8px; }
  .log-stack { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; font-size: 11px; line-height: 1.6; color: var(--muted); overflow-x: auto; white-space: pre-wrap; font-family: var(--mono); }
  .log-context { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .log-context-item { background: var(--bg); padding: 4px 8px; border-radius: 3px; border: 1px solid var(--line); }
  .log-context-key { color: var(--blue); }
  .log-context-val { color: var(--text); margin-left: 4px; }

  .empty-state { padding: 60px 24px; text-align: center; color: var(--muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

  footer {
    border-top: 1px solid var(--line); padding: 12px 24px;
    font-size: 11px; color: var(--muted); line-height: 1.6; background: var(--surface);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>VANTA<span>GE</span></h1>
    <p>Error Logs — Backend Error Monitoring</p>
  </div>
  <nav class="nav-tabs" style="display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:var(--radius);border:1px solid var(--line);">
    <a href="HMI.html" class="nav-tab" style="font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:4px;">Single Audit</a>
    <a href="batch.html" class="nav-tab" style="font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:4px;">Batch Auditor</a>
    <a href="history.html" class="nav-tab" style="font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:4px;">Historical Trends</a>
    <a href="error-logs.html" class="nav-tab active" style="font-family:var(--mono);font-size:11px;color:var(--amber);text-decoration:none;padding:5px 12px;border-radius:4px;background:var(--surface);border:1px solid var(--line);">Error Logs</a>
    <a href="tests.html" class="nav-tab" style="font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:4px;">Unit Tests</a>
  </nav>
  <div class="header-actions">
    <button class="btn btn-sm btn-danger" id="clearLogsBtn">Clear All Logs</button>
  </div>
</header>

<div class="main">
  <div class="controls">
    <div class="group">
      <label>Level:</label>
      <select id="levelFilter">
        <option value="all">All</option>
        <option value="error">Error</option>
        <option value="warn">Warning</option>
        <option value="info">Info</option>
        <option value="debug">Debug</option>
      </select>
    </div>
    <div class="group">
      <label>Source:</label>
      <select id="sourceFilter">
        <option value="all">All</option>
      </select>
    </div>
    <div class="group">
      <label><input type="checkbox" id="autoScroll" checked> Auto-scroll</label>
    </div>
    <div class="group">
      <label><input type="checkbox" id="showStack" checked> Show Stack</label>
    </div>
    <div class="group">
      <label><input type="checkbox" id="showContext" checked> Show Context</label>
    </div>
    <div class="log-stats" id="logStats"></div>
  </div>

  <div class="log-container">
    <div class="log-header">
      <span id="logCount">0 entries</span>
      <span id="timeRange">No logs</span>
    </div>
    <div class="log-list" id="logList">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>No error logs captured yet.</p>
        <p style="margin-top: 8px; font-size: 12px;">Logs will appear here when errors occur in HMI Analyzer.</p>
      </div>
    </div>
  </div>
</div>

<footer>
  <span>Vantage Error Logger — IIT Kanpur &middot; Arshbir Singh & Ashman Das</span>
  <span id="storageInfo">Storage: 0 KB</span>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const LOG_KEY = 'hmi_error_logs';
const MAX_LOGS = 500;

function getLogs() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
  catch { return []; }
}

function saveLogs(logs) {
  localStorage.setItem(LOG_KEY, JSON.stringify(logs.slice(-MAX_LOGS)));
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString() + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function formatTimeFull(ts) {
  const d = new Date(ts);
  return d.toLocaleString();
}

function getSeverityClass(level) {
  return { error: 'error', warn: 'warn', info: 'info', debug: 'debug' }[level] || '';
}

function getLevelLabel(level) {
  return { error: 'ERROR', warn: 'WARN', info: 'INFO', debug: 'DEBUG' }[level] || level.toUpperCase();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderLogs() {
  const logs = getLogs();
  const levelFilter = $('levelFilter').value;
  const sourceFilter = $('sourceFilter').value;
  const showStack = $('showStack').checked;
  const showContext = $('showContext').checked;

  const filtered = logs.filter(l => {
    if (levelFilter !== 'all' && l.level !== levelFilter) return false;
    if (sourceFilter !== 'all' && l.source !== sourceFilter) return false;
    return true;
  });

  const list = $('logList');
  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>No logs match current filters.</p>
      </div>`;
    $('logCount').textContent = `${logs.length} total, 0 shown`;
    return;
  }

  // Update source filter options
  const sources = [...new Set(logs.map(l => l.source).filter(Boolean))];
  const sourceFilterEl = $('sourceFilter');
  const currentSource = sourceFilterEl.value;
  sourceFilterEl.innerHTML = '<option value="all">All</option>' +
    sources.map(s => `<option value="${escapeHtml(s)}" ${s === currentSource ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('');

  list.innerHTML = filtered.map(log => `
    <div class="log-entry ${getSeverityClass(log.level)}">
      <div class="log-entry-header">
        <span class="log-time">${formatTime(log.timestamp)}</span>
        <span class="log-level ${log.level}">${getLevelLabel(log.level)}</span>
        ${log.source ? `<span class="log-source">${escapeHtml(log.source)}</span>` : ''}
      </div>
      <div class="log-message">${escapeHtml(log.message)}</div>
      ${showStack && log.stack ? `<pre class="log-stack">${escapeHtml(log.stack)}</pre>` : ''}
      ${showContext && log.context && Object.keys(log.context).length ? `
        <div class="log-context">
          ${Object.entries(log.context).map(([k, v]) => `
            <span class="log-context-item"><span class="log-context-key">${escapeHtml(k)}:</span> <span class="log-context-val">${escapeHtml(JSON.stringify(v))}</span></span>
          `).join('')}
        </div>` : ''}
    </div>
  `).join('');

  $('logCount').textContent = `${logs.length} total, ${filtered.length} shown`;
  
  if (logs.length) {
    const first = logs[0].timestamp;
    const last = logs[logs.length - 1].timestamp;
    $('timeRange').textContent = `${formatTimeFull(first)} — ${formatTimeFull(last)}`;
  }

  // Update storage info
  const size = new Blob([localStorage.getItem(LOG_KEY) || '']).size;
  $('storageInfo').textContent = `Storage: ${(size / 1024).toFixed(1)} KB`;
}

function clearLogs() {
  if (confirm('Clear all error logs?')) {
    localStorage.removeItem(LOG_KEY);
    renderLogs();
  }
}

// Auto-refresh when storage changes (from other tabs/windows)
window.addEventListener('storage', (e) => {
  if (e.key === LOG_KEY) renderLogs();
});

// Periodic refresh
setInterval(renderLogs, 1000);

// Event listeners
$('levelFilter').addEventListener('change', renderLogs);
$('sourceFilter').addEventListener('change', renderLogs);
$('autoScroll').addEventListener('change', () => {});
$('showStack').addEventListener('change', renderLogs);
$('showContext').addEventListener('change', renderLogs);
$('clearLogsBtn').addEventListener('click', clearLogs);

// Initial render
renderLogs();

// Expose logging API for HMI.html to use
window.ErrorLogger = {
  log: (level, message, source, context, stack) => {
    const logs = getLogs();
    logs.push({
      timestamp: Date.now(),
      level,
      message: String(message),
      source: source || 'hmi',
      context: context || {},
      stack: stack || ''
    });
    saveLogs(logs);
    renderLogs();
  },
  error: (msg, src, ctx, stack) => window.ErrorLogger.log('error', msg, src, ctx, stack),
  warn: (msg, src, ctx) => window.ErrorLogger.log('warn', msg, src, ctx),
  info: (msg, src, ctx) => window.ErrorLogger.log('info', msg, src, ctx),
  debug: (msg, src, ctx) => window.ErrorLogger.log('debug', msg, src, ctx),
  getLogs,
  clear: () => { localStorage.removeItem(LOG_KEY); renderLogs(); }
};

// Auto-scroll to bottom if enabled
function autoScroll() {
  if ($('autoScroll').checked) {
    const list = $('logList');
    list.scrollTop = list.scrollHeight;
  }
}

// Patch renderLogs to auto-scroll
const origRender = renderLogs;
renderLogs = function() {
  origRender();
  autoScroll();
};
</script>
</body>
</html>
